name: X 自動投稿

on:
  schedule:
    # cron は UTC。日本時間 07:30 / 12:10 / 17:40 / 20:30 / 22:15 に対応する。
    # 実行がずれても、スクリプト側が JST の時刻から最も近い枠を選ぶ。
    - cron: '30 22 * * *' # 翌 07:30 JST
    - cron: '10 3 * * *' #  12:10 JST
    - cron: '40 8 * * *' #  17:40 JST
    - cron: '30 11 * * *' #  20:30 JST
    - cron: '15 13 * * *' #  22:15 JST
  workflow_dispatch:
    inputs:
      index:
        description: 'キューの何番目を投稿するか（空なら日時から自動判定）'
        required: false
      dry_run:
        description: '送信せず内容だけ確認する'
        type: boolean
        default: true
  pull_request:
    paths:
      - 'scripts/x/**'
      - 'src/content/articles/**'

concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: キューを検査する
        run: node scripts/x/validate.mjs

      # PR では検査だけ行い、投稿はしない
      - name: 投稿する
        if: github.event_name != 'pull_request'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          node scripts/x/post.mjs \
            ${{ inputs.index && format('--index {0}', inputs.index) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
